image: freebsd/14.x
sources:
- https://git.sr.ht/~bakpakin/bender
packages:
- gmake
tasks:
- build: |
    cd bender
    gmake
    gmake test
    sudo gmake install
    sudo gmake uninstall
- build-sanitizers: |
    cd bender
    CFLAGS="-g -O2 -fsanitize=address,undefined" gmake
    gmake test
    sudo gmake install
    sudo gmake uninstall
